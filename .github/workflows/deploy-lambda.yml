name: Deploy Flask App to AWS Lambda

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Package Lambda application
        run: |
          mkdir package
          pip install -r requirements.txt --target package
          cp app.py lambda_function.py package/
          cd package
          zip -r ../deployment.zip .

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name aws-cicd-platform-app \
            --zip-file fileb://deployment.zip

          aws lambda wait function-updated \
            --function-name aws-cicd-platform-app

      - name: Verify live application
        env:
          LAMBDA_FUNCTION_URL: ${{ vars.LAMBDA_FUNCTION_URL }}
        run: |
          set -e

          BASE_URL="${LAMBDA_FUNCTION_URL%/}"

          echo "Testing home endpoint..."
          HOME_RESPONSE=$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$BASE_URL/")

          echo "$HOME_RESPONSE"
          [[ "$HOME_RESPONSE" == *"Hello, AWS Cloud Engineer!"* ]]

          echo "Testing health endpoint..."
          HEALTH_RESPONSE=$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$BASE_URL/health")

          echo "$HEALTH_RESPONSE"
          echo "$HEALTH_RESPONSE" | python -c \
            "import json,sys; assert json.load(sys.stdin).get('status') == 'healthy'"

          echo "Both live endpoint checks passed!"

